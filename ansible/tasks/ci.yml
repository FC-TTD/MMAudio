- name: Ensure remote build directory exists
  ansible.builtin.file:
    path: "{{ remote_project_root }}"
    state: directory
    mode: "0755"

- name: Sync repository to build host
  ansible.builtin.shell: >-
    rsync -az --delete
    {% for item in build_context_sync_excludes %}--exclude {{ item | quote }} {% endfor %}
    {{ repo_path }}/ {{ ansible_user }}@{{ ansible_host }}:{{ remote_project_root }}/
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: true

- name: Build and push image with registry cache
  ansible.builtin.shell: >-
    docker buildx build
    --builder {{ ci_builder_name }}
    --network {{ ci_build_network }}
    --platform {{ ci_platform }}
    --cache-from type=registry,ref={{ ci_cache_ref }}
    --cache-to type=registry,ref={{ ci_cache_ref }},mode=max
    --tag {{ image_ref }}
    {% if ci_push_latest %}--tag {{ image_repo }}:latest{% endif %}
    --push
    {{ remote_project_root }}
  args:
    executable: /bin/bash
  register: build_push_result
  changed_when: true
