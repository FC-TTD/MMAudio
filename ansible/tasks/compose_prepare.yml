- name: Ensure remote project root exists
  ansible.builtin.file:
    path: "{{ remote_project_root }}"
    state: directory
    mode: "0755"

- name: Upload deploy compose file
  ansible.builtin.copy:
    src: "{{ repo_path }}/{{ compose_file }}"
    dest: "{{ remote_project_root }}/{{ compose_file }}"
    mode: "0644"

- name: Pull and recreate compose service
  ansible.builtin.shell: >-
    cd {{ remote_project_root }} &&
    MMAUDIO_IMAGE={{ image_ref }}
    MMAUDIO_GPU_ID={{ mmaudio_gpu_id }}
    MMAUDIO_PORT={{ mmaudio_port }}
    docker compose -f {{ compose_file }} pull &&
    MMAUDIO_IMAGE={{ image_ref }}
    MMAUDIO_GPU_ID={{ mmaudio_gpu_id }}
    MMAUDIO_PORT={{ mmaudio_port }}
    docker compose -f {{ compose_file }} up -d --force-recreate
  args:
    executable: /bin/bash
  register: deploy_result
  changed_when: true
